name: worldwar-bot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: worldwar-run
  cancel-in-progress: true
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Run upgraded bot without automatic reset
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PAT: ${{ github.token }}
          INLOOP_AUTOSAVE: '1'
          AUTOSAVE_MIN: '2'
        run: python -u run.py
      - name: Final database snapshot
        if: always()
        env:
          PAT: ${{ github.token }}
        run: python save_db.py
